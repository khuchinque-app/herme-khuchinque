model:
  default: qwen3.8-flash
  provider: custom
  base_url: https://api.b.ai/v1
  api_key: ${B_AI_API_KEY}
  aliases:
    qwen3.8-flash: custom/qwen3.8-flash
    glm5.3-flash: custom/glm5.3-flash
    hy3: custom/hy3
    mimo2.5: custom/mimo2.5
model_aliases:
  agnes-2.5:
    model: agnes-2.5-flash
    provider: custom
    base_url: https://apihub.agnes-ai.com/v1
    key_env: AGNES_API_KEY
  agnes-3.0:
    model: agnes-3.0-flash
    provider: custom
    base_url: https://apihub.agnes-ai.com/v1
    key_env: AGNES_API_KEY
web:
  backend: nous
browser:
  cloud_provider: nous
stt:
  provider: nous
_config_version: 42
image_gen:
  provider: nous
video_gen:
  provider: nous
onboarding:
  seen:
    openclaw_residue_cleanup: true
    busy_input_prompt: true
    tool_progress_prompt: true
display:
  skin: ChinQue
mcp_servers:
  headroom:
    command: /home/khuchinque/.local/bin/headroom
    args:
      - mcp
      - serve
    enabled: true
  codegraph:
    command: /home/khuchinque/.npm-global/bin/codegraph
    args:
      - serve
      - --mcp
    timeout: 120
    connect_timeout: 60
    enabled: true
  graphify:
    command: /home/khuchinque/.local/bin/graphify-mcp
    enabled: true
  codebase-memory-mcp:
    command: "/home/khuchinque/.local/bin/codebase-memory-mcp"
hooks:
  pre_llm_call:
    - command: /home/khuchinque/.hermes/profiles/herme-khuchinque/bin/skill-combo.sh
      timeout: 10
hooks_auto_accept: true
