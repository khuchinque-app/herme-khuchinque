  provider: custom
  base_url: https://api.b.ai/v1
  api_key: ${B_AI_API_KEY}
  aliases:
    qwen3.8-flash: custom/qwen3.8-flash
    glm5.3-flash: custom/glm5.3-flash
    hy3: custom/hy3
    mimo2.5: custom/mimo2.5
display:
  skin: ChinQue
plugins:
  enabled: []
hooks:
  pre_tool_call:
    - matcher: terminal
      command: python3 /home/khuchinque/.hermes/profiles/herme-khuchinque/agent-hooks/ztk-rewrite.py
      timeout: 10
hooks_auto_accept: true
onboarding:
  seen:
    openclaw_residue_cleanup: true
    tool_progress_prompt: true
    busy_input_prompt: true
